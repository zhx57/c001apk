name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v3

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            # 从网页粘贴的 base64 常夹带换行/行尾空格，先清洗再解码，否则 base64 -d 会直接报错
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > key.jks
            echo KEYSTORE_PATH='${{ github.workspace }}/key.jks' >> local.properties
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          else
            echo "::warning::未配置 SIGN_KEYSTORE_BASE64，release 将退回 debug 签名（仅供测试，不可作为正式版分发）"
          fi

      # 注意：不要钉死补丁号（如 v4.0.2），GitHub 会把废弃的旧版本直接判失败
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-core-${{ hashFiles('**/build.gradle.kts', '**/build.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-deps

      # 开启 Gradle 编译缓存（org.gradle.caching=true 在 gradle.properties 中已设置）。
      # 用稳定 key 持久化 build-cache，编译产物跨构建复用；key 带 hash 不如稳定 key 命中率高，
      # 故这里用固定 key + restore-keys 回退，始终覆盖为最近一次成功的缓存。
      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-*
          key: gradle-build-cache
          restore-keys: |
            gradle-build-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release
        id: buildRelease
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee gradle-release.log
          echo "releaseName=$(ls app/build/outputs/apk/release/*.apk | awk -F '(/|\\.apk)' '{print $6}')" >> $GITHUB_OUTPUT

      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildRelease.outputs.releaseName }}
          path: "app/build/outputs/apk/release/*.apk"

      # 每次都把 release 的签名证书指纹打到日志，防止某次悄悄退回 debug 签名
      - name: Verify release signature
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
            echo "::notice::$(basename "$APK") 签名证书 SHA-256 = $(grep -m1 'certificate SHA-256 digest' /tmp/certs.txt | sed 's/.*digest: //')"
          else
            echo "::warning::未找到 apksigner，跳过签名校验"
          fi

      - name: Upload mappings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: "app/build/outputs/mapping/release"

      # 失败时把 Gradle 日志尾部转成 annotation，
      # 这样在 Actions 页面和失败通知邮件里就能直接看到原因，不用再翻完整日志
      - name: Report Gradle failure
        if: failure()
        run: |
          echo "::error::REPORT-STEP | pwd=$(pwd) | logs=$(ls -1 gradle-*.log 2>/dev/null | tr '\n' ' ')"
          for f in gradle-release.log; do
            if [ -f "$f" ]; then
              echo "::error::logs found: $f ($(wc -c < "$f") bytes)"
              tail -25 "$f" | while IFS= read -r line; do echo "::error::$line"; done
              break
            fi
          done
